name: zoomable_positioned_list
version: 1.1.0
description: >
  A zoomable scrollable positioned list based on scrollable_positioned_list.
  Supports pinch-to-zoom with focal point preservation while maintaining
  index-based position tracking.

repository: https://github.com/niuhuan/zoomable_positioned_list

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
