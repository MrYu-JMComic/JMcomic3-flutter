name: Release

permissions:
  contents: write

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
  NDK_VERSION: 27.2.12479018
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: '3.7.3'
  JDK_VERSION: 17

jobs:
  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    needs:
      - check_release
      - build_release_assets
    steps:
      - run: exit 0

  check_release:
    name: Check release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check-release.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check and create release
        id: check-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export VERSION=$(cat ci/version.code.txt | xargs echo)
          APP_NAME="Jmcomic3"
          if [[ "$VERSION" == v* ]]; then
            RELEASE_TITLE="$APP_NAME $VERSION"
          else
            RELEASE_TITLE="$APP_NAME v$VERSION"
          fi
          echo "VERSION : $VERSION"
          echo "RELEASE_TITLE : $RELEASE_TITLE"
          declare -A asset_dict
          asset_dict["android-arm64"]="$APP_NAME-arm64-v8a-$VERSION.apk"
          asset_dict["android-arm32"]="$APP_NAME-armeabi-v7a-$VERSION.apk"
          asset_dict["android-core"]="$APP_NAME-android-core-$VERSION.zip"
          declare -A host_dict
          host_dict["android-arm64"]="ubuntu-latest"
          host_dict["android-arm32"]="ubuntu-latest"
          host_dict["android-core"]="ubuntu-latest"
          export RELEASE=$(gh release view $VERSION --json id -q .id || echo "NOT_FOUND")
          echo "RELEASE : $RELEASE"
          if [ "$RELEASE" == "NOT_FOUND" ]; then
            echo "Release does not exist. Creating release $VERSION."
            gh release create $VERSION -t "$RELEASE_TITLE" -F ci/version.info.txt --target ${{ github.sha }}
          else
            echo "Release $VERSION already exists."
            gh release edit $VERSION --title "$RELEASE_TITLE"
          fi
          gh release view $VERSION --json assets > release_assets.json
          echo release_assets.json :
          cat release_assets.json
          matrix='['
          for key in "${!asset_dict[@]}"; do
            asset_name=${asset_dict[$key]}
            asset_exists=$(jq ".assets[].label" release_assets.json | grep -Fx "\"$asset_name\"" || echo "NOT_FOUND")
            if [ "$asset_exists" == "NOT_FOUND" ]; then
              echo "Asset $asset_name does not exist. Upload is required."
              matrix+="{\"target\": \"$key\", \"host\": \"${host_dict[$key]}\"},"
            else
              echo "Asset $asset_name already exists. No upload is required."
            fi
          done
          matrix=${matrix%,}
          matrix+=']'
          echo matrix=$matrix >> $GITHUB_OUTPUT
          echo "GITHUB_OUTPUT : $GITHUB_OUTPUT :"
          cat $GITHUB_OUTPUT

  build_release_assets:
    name: Build release assets
    needs:
      - check_release
    strategy:
      fail-fast: false
      matrix:
        config: ${{ fromJson(needs.check_release.outputs.matrix) }}

    runs-on: ${{ matrix.config.host }}

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Cache Flutter dependencies
        uses: actions/cache@v3
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Setup java
        uses: actions/setup-java@v3
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: temurin

      - name: Setup android tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          packages: platform-tools platforms;android-32 build-tools;30.0.2 ndk;${{ env.NDK_VERSION }}

      - name: Set version
        run: |
          cd ci
          cp version.code.txt ../lib/assets/version.txt

      - name: Verify bundled JNI libs
        shell: bash
        run: |
          if [ "${{ matrix.config.target }}" = "android-arm64" ]; then
            test -f android/app/src/main/jniLibs/arm64-v8a/librust.so
          elif [ "${{ matrix.config.target }}" = "android-arm32" ]; then
            test -f android/app/src/main/jniLibs/armeabi-v7a/librust.so
          else
            test -f android/app/src/main/jniLibs/arm64-v8a/librust.so
            test -f android/app/src/main/jniLibs/armeabi-v7a/librust.so
          fi

      - name: Build Android core
        if: matrix.config.target == 'android-core'
        run: zip -r -9 android-core.zip android/app/src/main/jniLibs

      - name: Build Android arm64
        if: matrix.config.target == 'android-arm64'
        run: flutter build apk --target-platform android-arm64 --split-per-abi

      - name: Build Android arm32
        if: matrix.config.target == 'android-arm32'
        run: flutter build apk --target-platform android-arm --split-per-abi

      - name: Sign APK
        if: matrix.config.target == 'android-arm32' || matrix.config.target == 'android-arm64'
        env:
          KEY_FILE_BASE64: ${{ secrets.KEY_FILE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo $KEY_FILE_BASE64 > key.jks.base64
          base64 -d key.jks.base64 > key.jks
          if [ "${{ matrix.config.target }}" = "android-arm64" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          fi
          echo $KEY_PASSWORD | $ANDROID_HOME/build-tools/30.0.2/apksigner sign --ks key.jks "$APK_PATH"

      - name: Upload Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          export VERSION=$(cat ci/version.code.txt | xargs echo)
          APP_NAME="Jmcomic3"
          declare -A asset_dict
          asset_dict["android-arm64"]="$APP_NAME-arm64-v8a-$VERSION.apk"
          asset_dict["android-arm32"]="$APP_NAME-armeabi-v7a-$VERSION.apk"
          asset_dict["android-core"]="$APP_NAME-android-core-$VERSION.zip"
          declare -A asset_path_dict
          asset_path_dict["android-arm64"]="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          asset_path_dict["android-arm32"]="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          asset_path_dict["android-core"]="android-core.zip"

          asset_name=${asset_dict["${{ matrix.config.target }}"]}
          asset_path=${asset_path_dict["${{ matrix.config.target }}"]}

          echo "Uploading asset $asset_name from $asset_path"
          mv $asset_path $asset_name
          gh release upload $VERSION "${asset_name}#${asset_name}" --clobber
