name: Build

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GH_TOKEN != '' && secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
  RUST_BACKEND_REPO: MrYu-JMComic/jmcomic3-rust-backend
  NDK_VERSION: 25.2.9519653

jobs:
  ci-pass:
    name: CI is green
    runs-on: ubuntu-latest
    needs:
      - build_release_assets
    steps:
      - run: exit 0

  build_release_assets:
    name: Build release assets
    strategy:
      fail-fast: false
      matrix:
        config:
          - target: android-arm32
            host: ubuntu-latest
            flutter_version: '3.7.3'
            flutter_channel: stable
          - target: android-arm64
            host: ubuntu-latest
            flutter_version: '3.7.3'
            flutter_channel: stable

    runs-on: ${{ matrix.config.host }}

    env:
      TARGET: ${{ matrix.config.target }}
      flutter_version: ${{ matrix.config.flutter_version }}
      flutter_channel: ${{ matrix.config.flutter_channel }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Rust backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RUST_BACKEND_REPO }}
          token: ${{ secrets.RUST_BACKEND_TOKEN || secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          path: rust-backend
          fetch-depth: 1

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: /opt/hostedtoolcache/flutter
          key: ${{ runner.os }}-flutter

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.flutter_channel }}
          flutter-version: ${{ env.flutter_version }}
          architecture: x64

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup android tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          packages: platform-tools platforms;android-32 build-tools;30.0.2 ndk;${{ env.NDK_VERSION }}

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend/rust -> target

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: Build Android Rust so
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            echo "NDK directory not found: $ANDROID_NDK_HOME"
            ls -la "$ANDROID_HOME/ndk" || true
            exit 1
          fi
          pushd rust-backend/rust
          if [ "${{ matrix.config.target }}" = "android-arm64" ]; then
            cargo ndk -t arm64-v8a -o ../../android/app/src/main/jniLibs build --release
            cp ../../android/app/src/main/jniLibs/arm64-v8a/librust_lib_jasmine.so ../../android/app/src/main/jniLibs/arm64-v8a/librust.so
            rm -f ../../android/app/src/main/jniLibs/arm64-v8a/librust_lib_jasmine.so
          else
            cargo ndk -t armeabi-v7a -o ../../android/app/src/main/jniLibs build --release
            cp ../../android/app/src/main/jniLibs/armeabi-v7a/librust_lib_jasmine.so ../../android/app/src/main/jniLibs/armeabi-v7a/librust.so
            rm -f ../../android/app/src/main/jniLibs/armeabi-v7a/librust_lib_jasmine.so
          fi
          popd

      - name: Set version
        run: |
          cd ci
          cp version.code.txt ../lib/assets/version.txt

      - name: Verify bundled JNI libs
        shell: bash
        run: |
          if [ "${{ matrix.config.target }}" = "android-arm64" ]; then
            test -f android/app/src/main/jniLibs/arm64-v8a/librust.so
          else
            test -f android/app/src/main/jniLibs/armeabi-v7a/librust.so
          fi

      - name: Build Android arm64
        if: matrix.config.target == 'android-arm64'
        run: flutter build apk --target-platform android-arm64 --split-per-abi

      - name: Build Android arm32
        if: matrix.config.target == 'android-arm32'
        run: flutter build apk --target-platform android-arm --split-per-abi

      - name: Show APK size
        shell: bash
        run: |
          if [ "${{ matrix.config.target }}" = "android-arm64" ]; then
            ls -lh build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          else
            ls -lh build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          fi

      - name: Sign APK
        env:
          KEY_FILE_BASE64: ${{ secrets.KEY_FILE_BASE64 }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo $KEY_FILE_BASE64 > key.jks.base64
          base64 -d key.jks.base64 > key.jks
          if [ "${{ matrix.config.target }}" = "android-arm64" ]; then
            APK_PATH="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          fi
          echo $KEY_PASSWORD | $ANDROID_HOME/build-tools/30.0.2/apksigner sign --ks key.jks "$APK_PATH"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.config.target == 'android-arm64' && 'Jmcomic3-arm64-v8a.apk' || 'Jmcomic3-armeabi-v7a.apk' }}
          path: ${{ matrix.config.target == 'android-arm64' && 'build/app/outputs/flutter-apk/app-arm64-v8a-release.apk' || 'build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk' }}
          retention-days: 3
